title: [LED Displays]
description: [Some information about panels]

remote_theme: pmarsceill/just-the-docs
search_enabled: true
color_scheme: "panel"

plugins_dir: scripts

kramdown:
  toc_levels: "1,2"

# GitHub Pages force-loads jekyll-optional-front-matter and
# jekyll-titles-from-headings, so every README/notes file in a submodule would
# get a title from its first heading and show up in the just-the-docs menu.
# Without a derived title, pages lacking a front-matter `title:` are left out
# of the navigation. Only pages with explicit front matter appear in the menu.
titles_from_headings:
  enabled: false

exclude: [
    # Build and dependency directories
    ".pixi",
    "Generation 4/Firmware-Arena/.pixi",
    "Generation 6/Arena-Firmware/.pixi",
    "Generation 6/Panel-Firmware/.pixi",
    "Generation 6/webDisplayTools/.pixi",
    "Generation 6/webDisplayTools/node_modules",
    # Development docs: work-in-progress, not for the public site
    # (docs/development convention shared by this repo and the G6 submodules)
    "docs/development",
    "Generation 6/Arena-Firmware/docs/development",
    "Generation 6/maDisplayTools/docs/development",
    "Generation 6/webDisplayTools/docs/development",
    # Source code, test data and dev notes that should not be published as
    # site content. Pages are kept out of the menu by the titles_from_headings
    # setting above, so only paths with non-documentation content belong here.
    # Generation 3
    "Generation 3/AVRDude/controller",
    "Generation 3/AVRDude/panels",
    "Generation 3/AVRDude/udev",
    "Generation 3/Panelcom/examples",
    "Generation 3/Panelcom/panel_com",
    "Generation 3/Software/C code for Controller",
    "Generation 3/Software/C code for Panel",
    "Generation 3/Software/MATLAB Code",
    # Generation 4
    "Generation 4/Display_Tools/G4_Function_Generator/support",
    "Generation 4/Display_Tools/G4_Data_Analysis/data plotting",
    "Generation 4/Display_Tools/G4_Data_Analysis/data processing",
    "Generation 4/Display_Tools/G4_Data_Analysis/new_data_processing",
    "Generation 4/Display_Tools/G4_Data_Analysis/support/",
    "Generation 4/Display_Tools/G4_Protocol_Designer/plotting_files",
    "Generation 4/Display_Tools/G4_Protocol_Designer/run_protocols",
    "Generation 4/Display_Tools/G4_Protocol_Designer/support_files",
    "Generation 4/Display_Tools/G4_Protocol_Designer/test_protocols",
    "Generation 4/Display_Tools/PControl_Matlab/ao_functions",
    "Generation 4/Display_Tools/PControl_Matlab/controller",
    "Generation 4/Display_Tools/PControl_Matlab/Experiment",
    "Generation 4/Display_Tools/PControl_Matlab/functions",
    "Generation 4/Display_Tools/PControl_Matlab/IO_tools",
    "Generation 4/Display_Tools/PControl_Matlab/Mex_functions",
    "Generation 4/Display_Tools/PControl_Matlab/Pattern_tools",
    "Generation 4/Display_Tools/PControl_Matlab/Patterns",
    "Generation 4/Display_Tools/PControl_Matlab/tcp_udp_ip",
    "Generation 4/Display_Tools/PControl_Matlab/test_scripts",
    "Generation 4/Display_Tools/Pitching_Zaber_Stage/zaber functions/",
    "Generation 4/Firmware-Panels/hardware_v0p1",
    "Generation 4/Firmware-Panels/hardware_v0p2",
    "Generation 4/Firmware-Panels/library",
    "Generation 4/Firmware-Panels/test_controllers",
    "Generation 4/Hardware/stm32",
    # Generation 6
    "Generation 6/Arena-Firmware/debug",
    "Generation 6/maDisplayTools/tests",
    "Generation 6/maDisplayTools/configs",
    "Generation 6/webDisplayTools/tests",
    "Generation 6/webDisplayTools/course",
    "Generation 6/webDisplayTools/fictrac-bridge",
  ]

relative_links:
